spring:
  datasource:
    url: jdbc:h2:mem:ganera_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

ganera:
  jwt:
    secret: test-jwt-secret-de-al-menos-32-bytes-de-longitud
    expiration-minutes: 480
  encryption:
    key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  onboarding:
    secret: test-onboarding-secret
  frontend:
    origen: http://localhost:5173
  twilio:
    webhook-url: ""
  anthropic:
    api-key: ""
  extraccion:
    # Los tests deciden cuando se procesa la cola (llaman al servicio); nada de pasadas solas.
    planificador:
      activo: false
  retencion:
    # Los tests llaman a RetencionMensajesService cuando quieren; el job nocturno no corre.
    activo: false

twilio:
  account-sid: ""
  auth-token: ""

stripe:
  api-key: ""
  webhook-secret: ""
  price-id-explotacion: ""
  checkout:
    success-url: http://localhost:5173/facturacion?checkout=exito
    cancel-url: http://localhost:5173/facturacion?checkout=cancelado
