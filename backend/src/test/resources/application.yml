spring:
  datasource:
    url: jdbc:h2:mem:ganera_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Guardia DML de la auditoria (plan 2026-10-21, T6): solo en tests. InspectorDml anota las tablas
        # escritas para que GuardiaDml exija su fila de auditoria. Pasivo salvo entre armar()/desarmar().
        session_factory:
          statement_inspector: com.ganera.core.shared.auditoria.InspectorDml
  flyway:
    enabled: true
    # {vendor} lo resuelve Boot a "postgresql" o "h2": las migraciones y callbacks solo-Postgres van en
    # db/postgresql. La version es global entre carpetas (un hueco en H2 es normal); nunca dos ficheros con la
    # misma version.
    locations: classpath:db/migration,classpath:db/{vendor}
    # Sin esto, si db/postgresql no llegara al jar, Flyway 10 solo lo diria en DEBUG y el callback de seguridad
    # (afterMigrate__seguridad_esquema.sql: RLS y permisos) dejaria de ejecutarse en silencio (hallazgo de T1).
    fail-on-missing-locations: true

ganera:
  jwt:
    secret: test-jwt-secret-de-al-menos-32-bytes-de-longitud
    expiration-minutes: 480
  encryption:
    key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  onboarding:
    secret: test-onboarding-secret
  frontend:
    origen: http://localhost:5173
  twilio:
    webhook-url: ""
    whatsapp-from: ""
    status-callback-url: ""
  anthropic:
    api-key: ""
  extraccion:
    # Los tests deciden cuando se procesa la cola (llaman al servicio); nada de pasadas solas.
    planificador:
      activo: false
  retencion:
    # Los tests llaman a RetencionMensajesService cuando quieren; el job nocturno no corre.
    activo: false

twilio:
  account-sid: ""
  auth-token: ""

stripe:
  api-key: ""
  webhook-secret: ""
  price-id-explotacion: ""
  checkout:
    success-url: http://localhost:5173/facturacion?checkout=exito
    cancel-url: http://localhost:5173/facturacion?checkout=cancelado

logging:
  pattern:
    # requestId de la peticion (ContextoPeticionFilter lo pone en el MDC y lo devuelve en X-Request-Id; plan
    # 2026-10-21, D10) en cada linea de log, para que soporte encuentre los logs de un X-Request-Id. Boot lo intercala
    # en el patron por defecto; fuera de una peticion sale "[] ".
    correlation: "[%X{requestId:-}] "
