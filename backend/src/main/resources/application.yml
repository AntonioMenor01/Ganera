spring:
  application:
    name: ganera-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ganera}
    username: ${DATABASE_USERNAME:ganera}
    password: ${DATABASE_PASSWORD:ganera}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # {vendor} lo resuelve Boot a "postgresql" o "h2": las migraciones y callbacks solo-Postgres van en
    # db/postgresql. La version es global entre carpetas (un hueco en H2 es normal); nunca dos ficheros con la
    # misma version.
    locations: classpath:db/migration,classpath:db/{vendor}
    # Sin esto, si db/postgresql no llegara al jar, Flyway 10 solo lo diria en DEBUG y el callback de seguridad
    # (afterMigrate__seguridad_esquema.sql: RLS y permisos) dejaria de ejecutarse en silencio (hallazgo de T1).
    fail-on-missing-locations: true
  task:
    scheduling:
      pool:
        # Por defecto Spring Boot usa UN hilo para todos los @Scheduled. La extraccion por IA puede
        # tardar minutos (timeouts y reintentos del SDK) y no debe retrasar SuscripcionSyncScheduler
        # ni RetencionMensajesScheduler (B1, revision m2 de T2).
        size: 3

ganera:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: 480
  encryption:
    key: ${ENCRYPTION_KEY:}
  onboarding:
    secret: ${ONBOARDING_SECRET:}
  frontend:
    origen: ${FRONTEND_ORIGEN:http://localhost:5173}
  seguridad:
    # Strict-Transport-Security en todas las respuestas. Solo en produccion (application-clever.yml la pone a
    # true, ver SecurityConfig): en local se sirve por HTTP y no aporta nada.
    hsts-siempre: false
  auditoria:
    # IP de las filas de auditoria (plan 2026-10-21, D5). false: la de la conexion (getRemoteAddr()), que en local y
    # en los tests es la del cliente. Solo application-clever.yml la pone a true (detras del proxy de Clever: el
    # ultimo elemento de X-Forwarded-For). Sin placeholder a proposito; nunca definir GANERA_AUDITORIA_* en Clever.
    ip-desde-x-forwarded-for: false
  registro:
    # Registro publico (POST /gestorias/registro). CERRADO por defecto (Prompt C, D4, fail-closed):
    # cerrado responde 404 sin cuerpo y no crea nada. Sin placeholder ${...} a proposito; solo lo
    # abren los tests que lo necesitan (abrirlo en un entorno exigiria definir a mano
    # GANERA_REGISTRO_ABIERTO=true, por el binding relajado de Spring).
    abierto: false
  twilio:
    # URL publica exacta que Twilio llama (la del sandbox/numero); la firma se valida contra ella.
    # Vacia -> el webhook responde 503 y no guarda nada (fail-closed).
    webhook-url: ${TWILIO_WEBHOOK_URL:}
    # Remitente de las respuestas por WhatsApp (B2 reducido), p. ej. el del sandbox: whatsapp:+... o +...
    # Vacio (o sin TWILIO_ACCOUNT_SID/TWILIO_AUTH_TOKEN) -> POST /tramites/{id}/respuestas-whatsapp da 503
    # y no crea nada. La app arranca igual: el cliente de Twilio se crea en el primer envio.
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    # URL publica exacta del callback de estado (POST /webhooks/twilio/whatsapp/estado), sin query string.
    # Con ella, cada envio pide a Twilio que avise ahi de entregado/leido/fallido y las firmas del callback se
    # validan contra ella. Vacia -> se envia sin callback (la respuesta se queda en ENVIADO) y el endpoint
    # responde 503 (fail-closed).
    status-callback-url: ${TWILIO_STATUS_CALLBACK_URL:}
  anthropic:
    # Vacia -> la app arranca igual; cada extraccion falla con ExtraccionFallidaException.
    api-key: ${ANTHROPIC_API_KEY:}
  extraccion:
    # Planificador de la extraccion por IA en segundo plano (B1, T2).
    planificador:
      activo: true
    intervalo: PT5S
    lote: 10
    # Plazo tras el 1.er, 2.o y 3.er fallo; tras el 4.o fallo no hay mas intentos (D4).
    reintentos: PT1M,PT5M,PT30M
  retencion:
    # Job nocturno de retencion de mensajes de WhatsApp (B1, T3, D6), despues del de Stripe (03:00).
    activo: true
    cron: "0 30 3 * * *"
    # Plazos pendientes de confirmar por el abogado de Ganera (D6), junto con los DPA de Anthropic
    # y Twilio (notas del Prompt C).
    # Mensajes sin tramite (numero desconocido, contacto inactivo, error de recepcion): se borran.
    mensajes-sin-tramite: P30D
    # Mensajes con tramite: se vacia el texto ("[texto eliminado por antigüedad]"); el tramite se queda.
    texto-con-tramite: P12M

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}

stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-id-explotacion: ${STRIPE_PRICE_ID_EXPLOTACION:}
  checkout:
    success-url: http://localhost:5173/facturacion?checkout=exito
    cancel-url: http://localhost:5173/facturacion?checkout=cancelado

logging:
  pattern:
    # requestId de la peticion (ContextoPeticionFilter lo pone en el MDC y lo devuelve en X-Request-Id; plan
    # 2026-10-21, D10) en cada linea de log, para que soporte encuentre los logs de un X-Request-Id. Boot lo intercala
    # en el patron por defecto; fuera de una peticion sale "[] ".
    correlation: "[%X{requestId:-}] "
