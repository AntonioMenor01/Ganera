spring:
  application:
    name: ganera-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ganera}
    username: ${DATABASE_USERNAME:ganera}
    password: ${DATABASE_PASSWORD:ganera}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # {vendor} lo resuelve Boot a "postgresql" o "h2": las migraciones y callbacks solo-Postgres van en
    # db/postgresql. La version es global entre carpetas (un hueco en H2 es normal); nunca dos ficheros con la
    # misma version.
    locations: classpath:db/migration,classpath:db/{vendor}
    # Sin esto, si db/postgresql no llegara al jar, Flyway 10 solo lo diria en DEBUG y el callback de seguridad
    # (afterMigrate__seguridad_esquema.sql: RLS y permisos) dejaria de ejecutarse en silencio (hallazgo de T1).
    fail-on-missing-locations: true
  task:
    scheduling:
      pool:
        # Por defecto Spring Boot usa UN hilo para todos los @Scheduled. La extraccion por IA puede
        # tardar minutos (timeouts y reintentos del SDK) y no debe retrasar SuscripcionSyncScheduler
        # ni RetencionMensajesScheduler (B1, revision m2 de T2).
        size: 3

ganera:
  demo:
    # Semilla de datos inventados al arrancar. false por defecto (fail-closed). Solo el perfil
    # `demo` (application-demo.yml) la pone a true. Nunca definir GANERA_DEMO_* en Clever.
    sembrar: false
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: 480
  encryption:
    key: ${ENCRYPTION_KEY:}
  onboarding:
    secret: ${ONBOARDING_SECRET:}
  alta:
    automatica:
      # Alta automatica de cuentas desde los pagos de la landing (fila alta_pendiente PENDIENTE): crea sola
      # Gestoria + Usuario + Suscripcion, enlaza la Subscription de Stripe y envia los emails de bienvenida y
      # aviso al equipo (si EmailService esta activo). APAGADA por defecto: con el flag en false el planificador
      # no hace nada y el alta sigue siendo manual (POST /internal/onboarding/gestoria). Encenderla NO cambia
      # nada hasta definir GANERA_ALTA_AUTOMATICA_ACTIVA=true.
      activa: ${GANERA_ALTA_AUTOMATICA_ACTIVA:false}
      # Intervalo del planificador (fixedDelay). Solo cuenta cuando activa=true.
      intervalo: ${GANERA_ALTA_AUTOMATICA_INTERVALO:PT30S}
  email:
    # Infraestructura de email (SMTP). APAGADA por defecto. Fail-closed: con `activo=false` (el valor por
    # defecto) o si falta la config SMTP (host o from en blanco), EmailService NO envia: registra un WARN y
    # vuelve sin error, nunca lanza y nunca rompe al que lo llame. La usa el alta automatica (bienvenida +
    # aviso al equipo). Los valores reales van en las variables de entorno de Clever, nunca en el repo.
    activo: ${EMAIL_ACTIVO:false}
    host: ${EMAIL_HOST:}
    puerto: ${EMAIL_PUERTO:587}
    usuario: ${EMAIL_USUARIO:}
    password: ${EMAIL_PASSWORD:}
    # Remitente (p. ej. "Ganera <no-responder@ganera.es>"). En blanco -> no se envia (fail-closed).
    from: ${EMAIL_FROM:}
  notificaciones:
    # Direccion interna a la que el alta automatica avisa de cada nueva alta (nombre, email, nif, plan; nunca
    # datos de tarjeta). EN BLANCO por defecto: si esta vacia, NO se envia el email de aviso al equipo (el de
    # bienvenida al cliente si se envia). Sin secretos; es una direccion de correo.
    equipo-email: ${GANERA_NOTIFICACIONES_EQUIPO_EMAIL:}
  frontend:
    origen: ${FRONTEND_ORIGEN:http://localhost:5173}
  seguridad:
    # Strict-Transport-Security en todas las respuestas. Solo en produccion (application-clever.yml la pone a
    # true, ver SecurityConfig): en local se sirve por HTTP y no aporta nada.
    hsts-siempre: false
  auditoria:
    # IP de las filas de auditoria (plan 2026-10-21, D5). false: la de la conexion (getRemoteAddr()), que en local y
    # en los tests es la del cliente. Solo application-clever.yml la pone a true (detras del proxy de Clever: el
    # ultimo elemento de X-Forwarded-For). Sin placeholder a proposito; nunca definir GANERA_AUDITORIA_* en Clever.
    ip-desde-x-forwarded-for: false
  registro:
    # Registro publico (POST /gestorias/registro). CERRADO por defecto (Prompt C, D4, fail-closed):
    # cerrado responde 404 sin cuerpo y no crea nada. Sin placeholder ${...} a proposito; solo lo
    # abren los tests que lo necesitan (abrirlo en un entorno exigiria definir a mano
    # GANERA_REGISTRO_ABIERTO=true, por el binding relajado de Spring).
    abierto: false
  twilio:
    # URL publica exacta que Twilio llama (la del sandbox/numero); la firma se valida contra ella.
    # Vacia -> el webhook responde 503 y no guarda nada (fail-closed).
    webhook-url: ${TWILIO_WEBHOOK_URL:}
    # Remitente de las respuestas por WhatsApp (B2 reducido), p. ej. el del sandbox: whatsapp:+... o +...
    # Vacio (o sin TWILIO_ACCOUNT_SID/TWILIO_AUTH_TOKEN) -> POST /tramites/{id}/respuestas-whatsapp da 503
    # y no crea nada. La app arranca igual: el cliente de Twilio se crea en el primer envio.
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    # URL publica exacta del callback de estado (POST /webhooks/twilio/whatsapp/estado), sin query string.
    # Con ella, cada envio pide a Twilio que avise ahi de entregado/leido/fallido y las firmas del callback se
    # validan contra ella. Vacia -> se envia sin callback (la respuesta se queda en ENVIADO) y el endpoint
    # responde 503 (fail-closed).
    status-callback-url: ${TWILIO_STATUS_CALLBACK_URL:}
  ai:
    # Proveedor de IA activo para la extraccion: anthropic (por defecto) o mistral. Si AI_PROVIDER no
    # esta definida se usa anthropic (el piloto corre con Haiku; en Clever AI_PROVIDER=anthropic). Mistral
    # queda seleccionable a mano con AI_PROVIDER=mistral, pendiente de rehacer con un modelo fijo y evaluar
    # (ver CLAUDE.md). El proveedor elegido se registra en el log (ProveedorIaConfig).
    provider: ${AI_PROVIDER:anthropic}
  anthropic:
    # Proveedor por defecto (piloto con Haiku). Vacia -> la app arranca igual; cada extraccion falla con
    # ExtraccionFallidaException.
    api-key: ${ANTHROPIC_API_KEY:}
  mistral:
    # Seleccionable con AI_PROVIDER=mistral. Vacia -> la app arranca igual; si mistral esta activo, cada
    # extraccion falla con ExtraccionFallidaException (igual criterio que la clave de Anthropic).
    api-key: ${MISTRAL_API_KEY:}
    # Modelo comparable a Haiku en coste/rendimiento; se puede fijar con MISTRAL_MODEL.
    model: ${MISTRAL_MODEL:mistral-small-latest}
  extraccion:
    # Planificador de la extraccion por IA en segundo plano (B1, T2).
    planificador:
      activo: true
    intervalo: PT5S
    lote: 10
    # Plazo tras el 1.er, 2.o y 3.er fallo; tras el 4.o fallo no hay mas intentos (D4).
    reintentos: PT1M,PT5M,PT30M
  ovz:
    worker:
      # Planificador del worker de presentacion automatica de la baja en OVZ (escalon 2, plan 2026-11-17).
      # DESACTIVADO en el backend: el backend no abre sesiones de OVZ ni Playwright. Corre SOLO en el perfil
      # `worker` (instancia Docker aparte, application-worker.yml), donde se pone a true.
      activo: false
      # Modo del worker (T4): ENSAYO (por defecto, recorre hasta ANTES de «Aceptar» y sale sin presentar nada) o
      # REAL (pulsa «Aceptar»). Cualquier otro valor se trata como ENSAYO. Se pasa a REAL solo con GANERA_OVZ_WORKER_MODO=REAL.
      modo: ENSAYO
      # URL de entrada de OVZnet y pausa del planificador (solo el perfil worker las usa).
      url: ""
      intervalo: PT10S
    presentacion-automatica:
      # Interruptor de la presentacion automatica de la baja (escalon 2, plan 2026-11-17), con dos niveles. Se lee
      # en el BACKEND al aprobar (encolar); el worker solo reclama trabajos ya encolados, asi que estas dos
      # variables van en el BACKEND (api.ganera.es), no en el worker.
      #
      # 1) `activa` — interruptor MAESTRO. APAGADO por defecto: con el apagado NO se encola ningun trabajo en
      #    trabajo_ovz al aprobar un BAJA_MUERTE, aunque el ganadero tenga credenciales (la via sigue siendo la
      #    manual, HECHO_EN_OVZ), sea cual sea la lista de abajo.
      #    Variable de entorno: GANERA_OVZ_PRESENTACION_AUTOMATICA_ACTIVA=true
      #
      # 2) `gestorias` — lista de ids de gestoria HABILITADAS, separadas por comas. VACIA por defecto (ninguna).
      #    Con el maestro encendido, solo las gestorias de esta lista presentan automaticamente; una lista vacia
      #    no habilita a ninguna. Fail-closed: se encola solo si (activa=true) Y (la gestoria esta en la lista).
      #    Variable de entorno: GANERA_OVZ_PRESENTACION_AUTOMATICA_GESTORIAS=4,7
      #
      # Se usan placeholders ${...} con el nombre EXACTO de la variable (no binding relajado: el guion de
      # `presentacion-automatica` haria que GANERA_OVZ_PRESENTACION_AUTOMATICA_* NO casara por binding relajado,
      # que quita los guiones). Asi el despliegue a produccion no cambia nada hasta encender el maestro y anadir
      # cada gestoria a la lista, una a una (rollout por gestoria, T6). El reencolado manual de un trabajo ya
      # existente no depende de esto.
      activa: ${GANERA_OVZ_PRESENTACION_AUTOMATICA_ACTIVA:false}
      gestorias: ${GANERA_OVZ_PRESENTACION_AUTOMATICA_GESTORIAS:}
  retencion:
    # Job nocturno de retencion de mensajes de WhatsApp (B1, T3, D6), despues del de Stripe (03:00).
    activo: true
    cron: "0 30 3 * * *"
    # Plazos pendientes de confirmar por el abogado de Ganera (D6), junto con los DPA de Anthropic
    # y Twilio (notas del Prompt C).
    # Mensajes sin tramite (numero desconocido, contacto inactivo, error de recepcion): se borran.
    mensajes-sin-tramite: P30D
    # Mensajes con tramite: se vacia el texto ("[texto eliminado por antigüedad]"); el tramite se queda.
    texto-con-tramite: P12M

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}

stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-id-explotacion: ${STRIPE_PRICE_ID_EXPLOTACION:}
  checkout:
    success-url: http://localhost:5173/facturacion?checkout=exito
    cancel-url: http://localhost:5173/facturacion?checkout=cancelado

logging:
  pattern:
    # requestId de la peticion (ContextoPeticionFilter lo pone en el MDC y lo devuelve en X-Request-Id; plan
    # 2026-10-21, D10) en cada linea de log, para que soporte encuentre los logs de un X-Request-Id. Boot lo intercala
    # en el patron por defecto; fuera de una peticion sale "[] ".
    correlation: "[%X{requestId:-}] "
