spring:
  application:
    name: ganera-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ganera}
    username: ${DATABASE_USERNAME:ganera}
    password: ${DATABASE_PASSWORD:ganera}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # Por defecto Spring Boot usa UN hilo para todos los @Scheduled. La extraccion por IA puede
        # tardar minutos (timeouts y reintentos del SDK) y no debe retrasar SuscripcionSyncScheduler
        # ni RetencionMensajesScheduler (B1, revision m2 de T2).
        size: 3

ganera:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: 480
  encryption:
    key: ${ENCRYPTION_KEY:}
  onboarding:
    secret: ${ONBOARDING_SECRET:}
  frontend:
    origen: ${FRONTEND_ORIGEN:http://localhost:5173}
  registro:
    # Registro publico (POST /gestorias/registro). CERRADO por defecto (Prompt C, D4, fail-closed):
    # cerrado responde 404 sin cuerpo y no crea nada. Sin placeholder ${...} a proposito; solo lo
    # abren los tests que lo necesitan (abrirlo en un entorno exigiria definir a mano
    # GANERA_REGISTRO_ABIERTO=true, por el binding relajado de Spring).
    abierto: false
  twilio:
    # URL publica exacta que Twilio llama (la del sandbox/numero); la firma se valida contra ella.
    # Vacia -> el webhook responde 503 y no guarda nada (fail-closed).
    webhook-url: ${TWILIO_WEBHOOK_URL:}
  anthropic:
    # Vacia -> la app arranca igual; cada extraccion falla con ExtraccionFallidaException.
    api-key: ${ANTHROPIC_API_KEY:}
  extraccion:
    # Planificador de la extraccion por IA en segundo plano (B1, T2).
    planificador:
      activo: true
    intervalo: PT5S
    lote: 10
    # Plazo tras el 1.er, 2.o y 3.er fallo; tras el 4.o fallo no hay mas intentos (D4).
    reintentos: PT1M,PT5M,PT30M
  retencion:
    # Job nocturno de retencion de mensajes de WhatsApp (B1, T3, D6), despues del de Stripe (03:00).
    activo: true
    cron: "0 30 3 * * *"
    # Plazos pendientes de confirmar por el abogado de Ganera (D6), junto con los DPA de Anthropic
    # y Twilio (notas del Prompt C).
    # Mensajes sin tramite (numero desconocido, contacto inactivo, error de recepcion): se borran.
    mensajes-sin-tramite: P30D
    # Mensajes con tramite: se vacia el texto ("[texto eliminado por antigüedad]"); el tramite se queda.
    texto-con-tramite: P12M

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}

stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-id-explotacion: ${STRIPE_PRICE_ID_EXPLOTACION:}
  checkout:
    success-url: http://localhost:5173/facturacion?checkout=exito
    cancel-url: http://localhost:5173/facturacion?checkout=cancelado
